<style>
  :root {
    --mount: #cdd1c1;
    --mount-weave: #c2c7b5;
    --mount-ink: #2a2e28;
    --mount-line: rgba(42, 46, 40, 0.3);
    --mount-btn: rgba(42, 46, 40, 0.06);
    --mount-btn-on: rgba(42, 46, 40, 0.14);
    --seal: #b23a26;
    --paper: #e2d2ab;
    --front: #ebdfc3;
    --front-ink: #2b2620;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
    --brush: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", "AR PL UKai CN", "Noto Serif SC", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --mount: #1b2325;
      --mount-weave: #212b2d;
      --mount-ink: #dad7c6;
      --mount-line: rgba(218, 215, 198, 0.26);
      --mount-btn: rgba(218, 215, 198, 0.07);
      --mount-btn-on: rgba(218, 215, 198, 0.17);
    }
  }
  :root[data-theme="dark"] {
    --mount: #1b2325;
    --mount-weave: #212b2d;
    --mount-ink: #dad7c6;
    --mount-line: rgba(218, 215, 198, 0.26);
    --mount-btn: rgba(218, 215, 198, 0.07);
    --mount-btn-on: rgba(218, 215, 198, 0.17);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--mount);
    color: var(--mount-ink);
    font-family: var(--serif);
    -webkit-text-size-adjust: 100%;
  }

  /* the mounted scroll: silk above and below, the painting between */
  .scroll {
    height: 100%;
    display: flex;
    flex-direction: column;
    background-color: var(--mount);
    background-image:
      repeating-linear-gradient(45deg, var(--mount-weave) 0 1px, transparent 1px 10px),
      repeating-linear-gradient(-45deg, var(--mount-weave) 0 1px, transparent 1px 10px);
  }
  .mount { flex: 1 1 0; min-height: 12px; }
  .mount-bottom { min-height: 64px; display: flex; align-items: center; }

  .stage {
    position: relative;
    flex: 0 0 auto;
    height: min(calc(100% - 76px), 122vw);
    border-top: 1px solid var(--mount-line);
    border-bottom: 1px solid var(--mount-line);
  }
  .view {
    position: relative;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    background: var(--paper) var(--grain, none) 0 0 / 256px 256px local;
    cursor: grab;
    touch-action: pan-x;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
    transition: background-color 0.5s;
  }
  .view::-webkit-scrollbar { display: none; }
  .view.dragging { cursor: grabbing; }
  .view:focus-visible { box-shadow: inset 0 0 0 2px var(--mount-ink); }
  .track { position: relative; height: 100%; width: 0; overflow: hidden; will-change: transform; }
  .tiles { position: absolute; top: 0; height: 100%; }
  .tiles canvas { position: absolute; top: 0; display: block; }

  @keyframes bloom { from { opacity: 0; } to { opacity: 1; } }
  .tiles canvas.in { animation: bloom 0.45s ease-out both; }

  /* frontispiece: the title panel a handscroll opens with */
  .front {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    column-gap: calc(var(--H) * 0.045);
    padding: calc(var(--H) * 0.075) calc(var(--H) * 0.07);
    padding-right: calc(var(--H) * 0.07 + 12px);
    background: var(--front) var(--grain, none) 0 0 / 256px 256px;
    color: var(--front-ink);
    border-right: 12px solid var(--mount);
    box-shadow: inset -1px 0 0 var(--mount-line), 1px 0 0 var(--mount-line);
    transition: background-color 0.5s;
    cursor: default;
  }
  .front .front-title {
    grid-column: 2;
    grid-row: 1;
    margin: 0;
    writing-mode: vertical-rl;
    font-family: var(--brush);
    font-weight: 400;
    font-size: calc(var(--H) * 0.168);
    line-height: 1;
    letter-spacing: 0.02em;
  }
  .seal {
    grid-column: 2;
    grid-row: 2;
    justify-self: center;
    align-self: end;
    width: calc(var(--H) * 0.1);
    height: calc(var(--H) * 0.1);
    opacity: 0.92;
  }
  .seal rect { fill: var(--seal); }
  .seal text { fill: var(--front); font-family: var(--serif); font-weight: 900; font-size: 16px; text-anchor: middle; }
  .front-text { grid-column: 1; grid-row: 1 / span 2; align-self: end; min-width: 0; }
  .front h1 {
    margin: 0 0 0.6em;
    font-size: clamp(1.1rem, calc(var(--H) * 0.052), 2.1rem);
    font-weight: 600;
    line-height: 1.16;
    text-wrap: balance;
  }
  .front-text p {
    margin: 0 0 0.9em;
    max-width: 32ch;
    font-size: clamp(0.8rem, calc(var(--H) * 0.03), 1.02rem);
    line-height: 1.6;
  }
  .front-text .credit { margin-bottom: 0; font-size: clamp(0.72rem, calc(var(--H) * 0.025), 0.86rem); opacity: 0.82; }
  .front a { color: inherit; text-underline-offset: 0.18em; }
  .front a:focus-visible { outline: 2px solid var(--front-ink); outline-offset: 2px; }

  .status {
    position: absolute;
    right: 12px;
    bottom: 10px;
    margin: 0;
    padding: 0.28em 0.7em;
    background: var(--front);
    color: var(--front-ink);
    border: 1px solid rgba(43, 38, 32, 0.25);
    font-size: 0.78rem;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .status.on { opacity: 0.94; }

  .controls {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 18px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  }
  .palettes { display: flex; align-items: center; gap: 4px; margin: 0; padding: 0; border: 0; min-width: 0; }
  .palettes label { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 5px; cursor: pointer; }
  .palettes input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .dish {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--mount-line);
    outline: 2px solid transparent;
    outline-offset: 3px;
    flex: none;
  }
  .palettes input:checked + .dish { outline-color: var(--mount-ink); }
  .palettes input:focus-visible + .dish { outline-color: var(--mount-ink); outline-style: dashed; }
  .pname { display: none; font-size: 0.9rem; white-space: nowrap; padding-right: 6px; }
  .palettes input:checked ~ .pname { display: inline; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .seed { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  .seed input {
    width: 10.5em;
    min-height: 44px;
    padding: 0 10px;
    font: inherit;
    font-size: 16px;
    color: inherit;
    background: var(--mount-btn);
    border: 1px solid var(--mount-line);
    border-radius: 2px;
  }
  .seed input:focus-visible { outline: 2px solid var(--mount-ink); outline-offset: 2px; }
  button {
    min-height: 44px;
    padding: 0 16px;
    font: inherit;
    font-size: 0.9rem;
    color: inherit;
    background: var(--mount-btn);
    border: 1px solid var(--mount-line);
    border-radius: 2px;
    cursor: pointer;
  }
  button:hover { background: var(--mount-btn-on); }
  button:focus-visible { outline: 2px solid var(--mount-ink); outline-offset: 2px; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .tiles canvas.in { animation: none; }
    .view, .front, .status { transition: none; }
  }
</style>
</head>
<body>
<main class="scroll">
  <div class="mount mount-top" aria-hidden="true"></div>

  <div class="stage">
    <div class="view" id="view" tabindex="0" role="group"
         aria-label="Landscape painting. Scroll, swipe, drag, or use the left and right arrow keys to travel along it.">
      <div class="track" id="track">
        <div class="tiles" id="tiles" aria-hidden="true"></div>
        <section class="front" id="front">
          <p class="front-title" lang="zh-Hans" aria-hidden="true">设色山水</p>
          <svg class="seal" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="2.5"/><text x="20" y="18.4">无</text><text x="20" y="35">尽</text></svg>
          <div class="front-text">
            <h1>Shan shui, in colour</h1>
            <p>An endless landscape handscroll, painted by code as it unrolls. Scroll or swipe to travel along it, or leave it to drift.</p>
            <p class="credit">A colour fork of <a href="https://github.com/LingDong-/shan-shui-inf" target="_blank" rel="noopener">{Shan, Shui}*</a> by Lingdong Huang.</p>
          </div>
        </section>
      </div>
    </div>
    <p class="status" id="status" role="status">Painting…</p>
  </div>

  <div class="mount mount-bottom">
    <div class="controls">
      <fieldset class="palettes" id="palettes">
        <legend class="vh">Colours</legend>
      </fieldset>
      <div class="actions">
        <label class="seed"><span>Seed</span><input id="seed" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="40"></label>
        <button type="button" id="again">Paint another</button>
        <button type="button" id="drift" aria-pressed="true">Pause drift</button>
      </div>
    </div>
  </div>
</main>

<script id="engine">
function ENGINE(SEED) {
  var console = { log: function() {} };
  // ---- seeded randomness: one independent stream per planned slice and per feature ----
  SEED = "" + SEED;
  function cyrb128(str) {
    var h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
    for (var i = 0, k; i < str.length; i++) {
      k = str.charCodeAt(i);
      h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
      h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
      h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
      h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    h1 ^= h2 ^ h3 ^ h4; h2 ^= h1; h3 ^= h1; h4 ^= h1;
    return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];

    return function() {
      a |= 0; b |= 0; c |= 0; d |= 0;
      var t = (((a + b) | 0) + d) | 0;
      d = (d + 1) | 0;
      a = b ^ (b >>> 9);
      b = (c + (c << 3)) | 0;
      c = (c << 21) | (c >>> 11);
      c = (c + t) | 0;
      return (t >>> 0) / 4294967296;
    };
  }
  function stream(kind, n) {
    var h = cyrb128(SEED + "\u0001" + kind + "\u0001" + n);
    var r = sfc32(h[0], h[1], h[2], h[3]);
    for (var i = 0; i < 12; i++) r();
    return r;
  }
  var RND = stream("init", 0);
  var REG = null; // region the feature being painted sits in
  var CUR_WASH = 14;
  var OPS = [];


  //https://raw.githubusercontent.com/processing/p5.js/master/src/math/noise.js
  var Noise = new function() {
    var PERLIN_YWRAPB = 4;
    var PERLIN_YWRAP = 1 << PERLIN_YWRAPB;
    var PERLIN_ZWRAPB = 8;
    var PERLIN_ZWRAP = 1 << PERLIN_ZWRAPB;
    var PERLIN_SIZE = 4095;
    var perlin_octaves = 4;
    var perlin_amp_falloff = 0.5;

    // lookup table, and the y / z layers are skipped when they cannot contribute
    var COS_N = 4096;

    for (var ci = 0; ci < COS_N + 2; ci++) COS[ci] = 0.5 * (1.0 - Math.cos((ci / COS_N) * Math.PI));

    this.noise = function(x, y, z) {
      y = y || 0;
      z = z || 0;
      if (perlin == null) {
        perlin = new Float64Array(PERLIN_SIZE + 1);
        for (var i = 0; i < PERLIN_SIZE + 1; i++) {
          perlin[i] = RND();
        }
      }
      if (x < 0) x = -x;
      if (y < 0) y = -y;
      if (z < 0) z = -z;
      var xi = Math.floor(x),
        yi = Math.floor(y),
        zi = Math.floor(z);
      var xf = x - xi;
      var yf = y - yi;
      var zf = z - zi;
      var useY = yf !== 0,
        useZ = zf !== 0;
      var rxf, ryf, rzf, t, ti;
      var r = 0;
      var ampl = 0.5;
      var n1, n2, n3;
      for (var o = 0; o < perlin_octaves; o++) {
        var of = xi + (yi << PERLIN_YWRAPB) + (zi << PERLIN_ZWRAPB);
        t = xf * COS_N;
        ti = t | 0;
        rxf = COS[ti] + (COS[ti + 1] - COS[ti]) * (t - ti);
        n1 = perlin[of & PERLIN_SIZE];
        n1 += rxf * (perlin[(of + 1) & PERLIN_SIZE] - n1);
        if (useY) {
          t = yf * COS_N;
          ti = t | 0;
          ryf = COS[ti] + (COS[ti + 1] - COS[ti]) * (t - ti);
          n2 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
          n2 += rxf * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n2);
          n1 += ryf * (n2 - n1);
        }
        if (useZ) {
          of += PERLIN_ZWRAP;
          n2 = perlin[of & PERLIN_SIZE];
          n2 += rxf * (perlin[(of + 1) & PERLIN_SIZE] - n2);
          if (useY) {
            n3 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
            n3 += rxf * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n3);
            n2 += ryf * (n3 - n2);
          }
          t = zf * COS_N;
          ti = t | 0;
          rzf = COS[ti] + (COS[ti + 1] - COS[ti]) * (t - ti);
          n1 += rzf * (n2 - n1);
        }
        r += n1 * ampl;
        ampl *= perlin_amp_falloff;
        xi <<= 1;
        xf *= 2;
        yi <<= 1;
        yf *= 2;
        zi <<= 1;
        zf *= 2;
        if (xf >= 1.0) {
          xi++;
          xf--;
        }
        if (yf >= 1.0) {
          yi++;
          yf--;
        }
        if (zf >= 1.0) {
          zi++;
          zf--;
        }
      }
      return r;
    };

      if (lod > 0) {

      }

      var lcg = (function() {
        var m = 4294967296,
          a = 1664525,
          c = 1013904223,
          seed,
          z;
        return {
          setSeed: function(val) {
            z = seed = (val == null ? RND() * m : val) >>> 0;

          getSeed: function() {
            return seed;
          },
          rand: function() {
            z = (a * z + c) % m;
            return z / m;
          },
        };
      })();
      lcg.setSeed(seed);
      perlin = new Array(PERLIN_SIZE + 1);
      for (var i = 0; i < PERLIN_SIZE + 1; i++) {
        perlin[i] = lcg.rand();
      }
    };
  }();

  var PolyTools = new function() {
    this.midPt = function() {
      var plist =
        arguments.length == 1 ? arguments[0] : Array.apply(null, arguments);
      return plist.reduce(
        function(acc, v) {
          /*       if (v == undefined || acc == undefined){
        console.log("ERRR");
        console.log(plist)
        return [0,0]
      } */
          return [v[0] / plist.length + acc[0], v[1] / plist.length + acc[1]];
        },
        [0, 0],
      );
    };
    this.triangulate = function(plist, args) {
      //return []
      var args = args != undefined ? args : {};
      var area = args.area != undefined ? args.area : 100;
      var convex = args.convex != undefined ? args.convex : false;
      var optimize = args.optimize != undefined ? args.optimize : true;
      function lineExpr(pt0, pt1) {
        var den = pt1[0] - pt0[0];
        var m = den == 0 ? Infinity : (pt1[1] - pt0[1]) / den;
        var k = pt0[1] - m * pt0[0];
        return [m, k];
      }
      function intersect(ln0, ln1) {
        var le0 = lineExpr(...ln0);
        var le1 = lineExpr(...ln1);
        var den = le0[0] - le1[0];
        if (den == 0) {
          return false;
        }
        var x = (le1[1] - le0[1]) / den;
        var y = le0[0] * x + le0[1];
        function onSeg(p, ln) {
          //non-inclusive
          return (
            Math.min(ln[0][0], ln[1][0]) <= p[0] &&
            p[0] <= Math.max(ln[0][0], ln[1][0]) &&
            Math.min(ln[0][1], ln[1][1]) <= p[1] &&
            p[1] <= Math.max(ln[0][1], ln[1][1])
          );
        }
        if (onSeg([x, y], ln0) && onSeg([x, y], ln1)) {
          return [x, y];
        }
        return false;
      }
      function ptInPoly(pt, plist) {
        var scount = 0;
        for (var i = 0; i < plist.length; i++) {
          var np = plist[i != plist.length - 1 ? i + 1 : 0];
          var sect = intersect(
            [plist[i], np],
            [pt, [pt[0] + 999, pt[1] + 999]],
          );
          if (sect != false) {
            scount++;
          }
        }
        return scount % 2 == 1;
      }
      function lnInPoly(ln, plist) {
        var lnc = [[0, 0], [0, 0]];
        var ep = 0.01;

        lnc[0][0] = ln[0][0] * (1 - ep) + ln[1][0] * ep;
        lnc[0][1] = ln[0][1] * (1 - ep) + ln[1][1] * ep;
        lnc[1][0] = ln[0][0] * ep + ln[1][0] * (1 - ep);
        lnc[1][1] = ln[0][1] * ep + ln[1][1] * (1 - ep);

        for (var i = 0; i < plist.length; i++) {
          var pt = plist[i];
          var np = plist[i != plist.length - 1 ? i + 1 : 0];
          if (intersect(lnc, [pt, np]) != false) {
            return false;
          }
        }
        var mid = PolyTools.midPt(ln);
        if (ptInPoly(mid, plist) == false) {
          return false;
        }
        return true;
      }

      function sidesOf(plist) {
        var slist = [];
        for (var i = 0; i < plist.length; i++) {
          var pt = plist[i];
          var np = plist[i != plist.length - 1 ? i + 1 : 0];
          var s = Math.sqrt(
            Math.pow(np[0] - pt[0], 2) + Math.pow(np[1] - pt[1], 2),
          );
          slist.push(s);
        }
        return slist;
      }
      function areaOf(plist) {
        var slist = sidesOf(plist);
        var a = slist[0],
          b = slist[1],

        var nw = wid * (((tl - i) / tl) * 0.5 + 0.5);
        trlist1.push([
          nx + Math.cos(ang + Math.PI / 2) * (nw + woff + b),
          ny + Math.sin(ang + Math.PI / 2) * (nw + woff + b),
        ]);
        trlist2.push([
          nx + Math.cos(ang - Math.PI / 2) * (nw - woff + b),
          ny + Math.sin(ang - Math.PI / 2) * (nw - woff + b),
        ]);
        lx = nx;
        ly = ny;
      }

      return [trlist1, trlist2];
    };

    var twig = function(tx, ty, dep, args) {
      var args = args != undefined ? args : {};
      var dir = args.dir != undefined ? args.dir : 1;
      var sca = args.sca != undefined ? args.sca : 1;
      var wid = args.wid != undefined ? args.wid : 1;
      var ang = args.ang != undefined ? args.ang : 0;
      var lea = args.lea != undefined ? args.lea : [true, 12];

      var canv = "";
      var twlist = [];
      var tl = 10;
      var hs = RND() * 0.5 + 0.5;
      var fun1 = function(x) {
        return Math.pow(x, 0.5);
      };
      var fun2 = function(x) {
        return -1 / Math.pow(i / tl + 1, 5) + 1;
      };

      var tfun = randChoice([fun2]);
      var a0 = ((RND() * Math.PI) / 6) * dir + ang;
      for (var i = 0; i < tl; i++) {
        var mx = dir * tfun(i / tl) * 50 * sca * hs;
        var my = -i * 5 * sca;

        var a = Math.atan2(my, mx);
        var d = Math.pow(mx * mx + my * my, 0.5);

        var nx = Math.cos(a + a0) * d;
        var ny = Math.sin(a + a0) * d;

        twlist.push([nx + tx, ny + ty]);
        if ((i == ((tl / 3) | 0) || i == (((tl * 2) / 3) | 0)) && dep > 0) {
          canv += twig(nx + tx, ny + ty, dep - 1, {
            ang: ang,
            sca: sca * 0.8,
            wid: wid,
            dir: dir * randChoice([-1, 1]),
            lea: lea,
          });
        }
        if (i == tl - 1 && lea[0] == true) {
          for (var j = 0; j < 5; j++) {
            var dj = (j - 2.5) * 5;
            canv += blob(
              nx + tx + Math.cos(ang) * dj * wid,
              ny + ty + (Math.sin(ang) * dj - lea[1] / (dep + 1)) * wid,
              {
                wid: (6 + 3 * RND()) * wid,
                len: (15 + 12 * RND()) * wid,
                ang:
                  ang / 2 + Math.PI / 2 + Math.PI * 0.2 * (RND() - 0.5),
                col: "rgba(100,100,100," + (0.5 + dep * 0.2).toFixed(3) + ")",
                fun: function(x) {
                  return x <= 1
                    ? Math.pow(Math.sin(x * Math.PI) * x, 0.5)
                    : -Math.pow(Math.sin((x - 2) * Math.PI * (x - 2)), 0.5);
                },
              },
            );
          }
        }
      }
      canv += stroke(twlist, {
        wid: 1,
        fun: function(x) {
          return Math.cos((x * Math.PI) / 2);
        },
        col: "rgba(100,100,100,0.5)",
      });
      return canv;
    };

    var barkify = function(x, y, trlist) {
      function bark(x, y, wid, ang) {
        var len = 10 + 10 * RND();
        var noi = 0.5;
        var fun = function(x) {
          return x <= 1
            ? Math.pow(Math.sin(x * Math.PI), 0.5)
            : -Math.pow(Math.sin((x + 1) * Math.PI), 0.5);
        };
        var reso = 20.0;
        var canv = "";

        var lalist = [];
        for (var i = 0; i < reso + 1; i++) {
          var p = (i / reso) * 2;
          var xo = len / 2 - Math.abs(p - 1) * len;
          var yo = (fun(p) * wid) / 2;
          var a = Math.atan2(yo, xo);
          var l = Math.sqrt(xo * xo + yo * yo);
          lalist.push([l, a]);
        }
        var nslist = [];
        var n0 = RND() * 10;
        for (var i = 0; i < reso + 1; i++) {
          nslist.push(Noise.noise(i * 0.05, n0));
        }

        loopNoise(nslist);
        var brklist = [];
        for (var i = 0; i < lalist.length; i++) {
          var ns = nslist[i] * noi + (1 - noi);
          var nx = x + Math.cos(lalist[i][1] + ang) * lalist[i][0] * ns;
          var ny = y + Math.sin(lalist[i][1] + ang) * lalist[i][0] * ns;
          brklist.push([nx, ny]);
        }
        var fr = RND();
        canv += stroke(brklist, {
          wid: 0.8,
          noi: 0,
          col: "rgba(100,100,100,0.4)",
          out: 0,
          fun: function(x) {
            return Math.sin((x + fr) * Math.PI * 3);
          },
        });

        return canv;
      }
      var canv = "";

      for (var i = 2; i < trlist[0].length - 1; i++) {
        var a0 = Math.atan2(
          trlist[0][i][1] - trlist[0][i - 1][1],
          trlist[0][i][0] - trlist[0][i - 1][0],
        );
        var a1 = Math.atan2(
          trlist[1][i][1] - trlist[1][i - 1][1],
          trlist[1][i][0] - trlist[1][i - 1][0],
        );
        var p = RND();
        var nx = trlist[0][i][0] * (1 - p) + trlist[1][i][0] * p;
        var ny = trlist[0][i][1] * (1 - p) + trlist[1][i][1] * p;

            wid: 6 - Math.abs(p - 0.5) * 10,
            ang: (a0 + a1) / 2,
            col: "rgba(100,100,100,0.6)",
          });
        } else {
          canv += bark(
            nx + x,
            ny + y,
            5 - Math.abs(p - 0.5) * 10,
            (a0 + a1) / 2,
          );
        }

        if (RND() < 0.05) {
          var jl = RND() * 2 + 2;
          var xya = randChoice([
            [trlist[0][i][0], trlist[0][i][1], a0],
            [trlist[1][i][0], trlist[1][i][1], a1],
          ]);
          for (var j = 0; j < jl; j++) {
            canv += blob(
              xya[0] + x + Math.cos(xya[2]) * (j - jl / 2) * 4,
              xya[1] + y + Math.sin(xya[2]) * (j - jl / 2) * 4,
              {
                wid: 4,
                len: 4 + 6 * RND(),
                ang: a0 + Math.PI / 2,
                col: "rgba(100,100,100,0.6)",
              },
            );
          }
        }
      }
      var trflist = trlist[0].concat(trlist[1].slice().reverse());
      var rglist = [[]];
      for (var i = 0; i < trflist.length; i++) {
        if (RND() < 0.5) {
          rglist.push([]);
        } else {
          rglist[rglist.length - 1].push(trflist[i]);
        }
      }

      for (var i = 0; i < rglist.length; i++) {
        rglist[i] = div(rglist[i], 4);
        for (var j = 0; j < rglist[i].length; j++) {
          rglist[i][j][0] +=
            (Noise.noise(i, j * 0.1, 1) - 0.5) * (15 + 5 * randGaussian());
          rglist[i][j][1] +=
            (Noise.noise(i, j * 0.1, 2) - 0.5) * (15 + 5 * randGaussian());
        }
        canv += stroke(
          rglist[i].map(function(v) {
            return [v[0] + x, v[1] + y];
          }),
          { wid: 1.5, col: "rgba(100,100,100,0.7)", out: 0 },
        );
      }
      return canv;
    };

      // anchored at the scroll origin, like the CSS grain on bare paper, so the two line up
      ctx.setTransform(DPR, 0, 0, DPR, -k * P - FRONT * DPR, 0);

      ctx.fillStyle = ctx.createPattern(grain, "repeat");
      ctx.fillRect((k * P) / DPR + FRONT, 0, P / DPR + 1, Hpx / DPR + 1);
    } catch (e) {}
    if (ep === epoch && lay === layoutEp) {
      have.set(k, ep);
      env.emit(k, ep, cv);
    }
  }

  function evict() {
    if (feats.size < 48) return;
    var w = viewB - viewA;
    var lo = viewA - 3 * w - 900, hi = viewB + 4 * w + 900;
    feats.forEach(function(F, idx) {
      var p = plans[idx];
      if (p.x1 < lo || p.x0 > hi) feats.delete(idx);
    });
  }

  function* work() {
    for (;;) {
      var k = nextTile();
      if (k === null) { yield "idle"; continue; }
      var lay = layoutEp;
      var xa = k * TWu, xb = xa + TWu;
      while (E.plannedTo() - REACH < xb) { E.planNext(); yield; }
      indexPlans();

      list.sort(function(a, b) { return a.z - b.z || a.idx - b.idx; });
      var ok = true;
      for (var n = 0; n < list.length && ok; n++) {

        }
      }
      if (!ok) continue;
      yield* raster(k, list, xa, xb);
      evict();
      yield;
    }
  }

  var it = work();
  return {
    msg: msg,
    step: function() { return it.next().value; },
  };
}

</script>

  } catch (e) {}

  // ---- seeds ------------------------------------------------------------------------

    "pale", "hidden", "gentle", "broken", "floating", "lonely", "golden", "frosted", "evening", "morning",
    "thousand", "nine", "cloud", "rain"];
  var WORDS_B = ["ridge", "river", "pine", "crane", "ferry", "pavilion", "gorge", "harbour", "peak", "willow",
    "temple", "bridge", "island", "valley", "cliff", "stream", "village", "bamboo", "lantern", "heron",
    "summit", "shore", "orchard", "pass"];
  function randomSeed() {

  // kept so that turning around does not repaint what was just seen; the furthest go first.
  function dropFarTiles(all) {
    var w = wantRange();

          },
        });
        postMessage({ t: "ready" });
        return;
      }
      if (!core) return;
      core.msg(m);
      if (!pumping) { pumping = true; postMessage({ t: "state", busy: true }); setTimeout(pump, 0); }
    };
  }

  function makePainter(seed) {
    var P = { mode: "worker", busy: false, dead: false };
    var worker = null, ready = false, local = null;
    var log = []; // layout / palette / view state to replay if we fall back

    function goLocal() {
      if (P.dead || P.mode === "local") return;
      P.mode = "local";
      try { if (worker) worker.terminate(); } catch (e) {}
      worker = null;
      local = CORE({
        seed: seed,
        canvas: function(w, h) {
          var c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          return c;
        },
        scratch: function() { return document.createElement("canvas"); },
        emit: function(k, ep, c) { if (!P.dead) onTile(k, ep, c); },
      });
      for (var i = 0; i < log.length; i++) local.msg(log[i]);
      P.busy = true;
    }
    try {
      if (NOWORKER) throw new Error("worker disabled");
      var src = "var ENGINE=" + ENGINE.toString() + ";var CORE=" + CORE.toString() + ";var makeGrain=" + makeGrain.toString() + ";(" + WORKER_MAIN.toString() + ")();";
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
      worker.onmessage = function(e) {
        if (P.dead || P.mode !== "worker") return;
        var m = e.data;
        if (m.t === "ready") ready = true;
        else if (m.t === "nocanvas") goLocal();
        else if (m.t === "tile") onTile(m.k, m.ep, m.bmp);
        else if (m.t === "state") P.busy = m.busy;
      };
      worker.onerror = function() { if (!ready) goLocal(); };
      worker.postMessage({ t: "init", seed: seed });
      setTimeout(function() { if (!ready) goLocal(); }, 3000);
    } catch (e) {
      goLocal();
    }
    P.msg = function(m) {
      if (P.dead) return;
      // remember the latest of each kind so a fallback can pick up where the worker left off
      if (m.t !== "drop") {
        log = log.filter(function(x) { return x.t !== m.t; });
        log.push(m);
      }
      if (P.mode === "worker") worker.postMessage(m);
      else { local.msg(m); P.busy = true; }
    };
    P.tick = function(budget) {
      if (P.mode !== "local" || !P.busy || P.dead) return;
      var t0 = performance.now(), r;
      do { r = local.step(); } while (r !== "idle" && performance.now() - t0 < budget);
      if (r === "idle") P.busy = false;
    };
    P.stop = function() {
      P.dead = true;
      try { if (worker) worker.terminate(); } catch (e) {}
    };
    return P;
  }

  var lastSentPos = null, lastSentT = 0;
  function sendView(force) {
    if (!H) return;
    var p = pos(), now = performance.now();
    if (!force && lastSentPos !== null && (Math.abs(p - lastSentPos) < 48 || now - lastSentT < 80)) return;
    lastSentPos = p;
    lastSentT = now;
    var a = (p - frontPx) / s;
    sentRange = wantRange();
    send({ t: "view", a: a, b: a + viewW / s, lo: sentRange.lo, hi: sentRange.hi });
  }

  function startPainting(newSeed) {
    seed = newSeed;
    seedInput.value = seed;
    try { history.replaceState(null, "", "#seed=" + encodeURIComponent(seed)); } catch (e) {}
    if (painter) painter.stop();
    clearTiles();
    driftPx = 0;
    applyDrift();
    programmatic = performance.now();
    view.scrollLeft = 0;
    growTrack(true);
    painter = makePainter(seed);
    if (H) send({ t: "layout", ep: ++epoch, P: TILE, Hpx: Hpx, q: Hpx / VB_H, dpr: dpr, front: frontPx });
    send({ t: "palette", ep: ++epoch, pal: paletteTable(paletteKey) });
    sendView(true);
    holdUntil = performance.now() + 7000;
  }

  // ---- travel --------------------------------------------------------------------------------
  var drifting = !reduceMotion;
  var userUntil = 0; // the reader is in control until this time
  var programmatic = 0; // time of our own last scrollLeft write
  var holdUntil = 0;
  var lastT = 0;
  var drag = null, vel = 0;
  var scrollSpeed = 0, speedX = 0, speedT = 0; // px/s, smoothed, from scroll events
  var wheelTarget = null, wheelSet = 0; // eased travel for a notched mouse wheel

  function setDrift(on) {
    drifting = on;
    driftBtn.textContent = on ? "Pause drift" : "Start drift";
    driftBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  setDrift(drifting);
  driftBtn.addEventListener("click", function() { setDrift(!drifting); });
  againBtn.addEventListener("click", function() { startPainting(randomSeed()); });
  seedInput.addEventListener("change", function() {
    var v = seedInput.value.trim().slice(0, 40);
    if (v && v !== seed) startPainting(v);
    else seedInput.value = seed;
  });
  seedInput.addEventListener("keydown", function(e) { if (e.key === "Enter") seedInput.blur(); });

  function userTook() {
    var now = performance.now();
    if (now > userUntil) fold(); // start of a gesture: make the scroll position the whole truth
    userUntil = now + 1800;
  }
  view.addEventListener("scroll", function() {
    var now = performance.now();
    if (now - programmatic > 60) { userTook(); lastScrollEv = now; }
    var x = view.scrollLeft;
    if (now - speedT > 250) scrollSpeed = 0;
    else if (now > speedT) scrollSpeed += ((Math.abs(x - speedX) / (now - speedT)) * 1000 - scrollSpeed) * 0.3;
    speedX = x;
    speedT = now;
    sendView(false);
  }, { passive: true });
  view.addEventListener("touchstart", function() { wheelTarget = null; userTook(); }, { passive: true });
  view.addEventListener("wheel", function(e) {
    userTook();
    // A plain mouse wheel only scrolls vertically, in notches. Send that along the scroll,
    // eased toward a running target each frame so a notch is a glide and not a jump.
    // Horizontal (trackpad) input is left to the browser.
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      var k = e.deltaMode === 1 ? 18 : e.deltaMode === 2 ? viewW : 1;
      var from = wheelTarget === null ? view.scrollLeft : wheelTarget;
      wheelTarget = Math.max(0, Math.min(view.scrollWidth - viewW, from + e.deltaY * k));
      wheelSet = view.scrollLeft;
      vel = 0;
    } else wheelTarget = null;
  }, { passive: true });
  view.addEventListener("keydown", function(e) {
    if (e.target !== view) return;
    if (e.key === " ") { setDrift(!drifting); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home") { wheelTarget = null; userTook(); }
  });
  // mouse drag (touch and trackpads scroll natively)
  view.addEventListener("pointerdown", function(e) {
    if (e.pointerType !== "mouse" || e.button !== 0) return;
    userTook();
    vel = 0;
    wheelTarget = null;
    drag = { id: e.pointerId, x: e.clientX, x0: e.clientX, moved: false, samples: [{ t: performance.now(), x: e.clientX }] };
  });
  view.addEventListener("pointermove", function(e) {
    if (!drag || e.pointerId !== drag.id) return;
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.x0) < 4) return;
      drag.moved = true;
      try { view.setPointerCapture(drag.id); } catch (err) {}
      view.classList.add("dragging");
    }
    view.scrollLeft -= e.clientX - drag.x;
    drag.x = e.clientX;
    drag.samples.push({ t: performance.now(), x: e.clientX });
    if (drag.samples.length > 6) drag.samples.shift();
    userUntil = performance.now() + 1800;
  });
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    view.classList.remove("dragging");
    if (drag.moved && drag.samples.length > 1) {
      var a = drag.samples[0], b = drag.samples[drag.samples.length - 1], dt = (b.t - a.t) / 1000;
      if (dt > 0.01 && performance.now() - b.t < 90) vel = Math.max(-6000, Math.min(6000, -(b.x - a.x) / dt));
    }
    var moved = drag.moved;
    drag = null;
    if (moved) {
      var stop = function(ev) { ev.preventDefault(); ev.stopPropagation(); };
      view.addEventListener("click", stop, { capture: true, once: true });
      setTimeout(function() { view.removeEventListener("click", stop, true); }, 0);
    }
  }
  view.addEventListener("pointerup", endDrag);
  view.addEventListener("pointercancel", endDrag);

  function frame(t) {
    var dt = Math.min(0.1, (t - lastT) / 1000) || 0;
    lastT = t;
    if (!H) {
      layout();
      requestAnimationFrame(frame);
      return;
    }
    if (wheelTarget !== null) {
      var cur = view.scrollLeft;
      if (Math.abs(cur - wheelSet) > 3) wheelTarget = null; // something else moved the scroll: let go
      else {
        var gap = wheelTarget - cur;
        var step = gap * (1 - Math.exp(-dt * 14));
        var least = 1 / Math.max(1, Math.round(dpr)); // smallest move the scroller will accept
        if (Math.abs(step) < least) step = Math.abs(gap) <= least ? gap : gap > 0 ? least : -least;
        view.scrollLeft = cur + step;
        wheelSet = view.scrollLeft;
        if (wheelSet === cur) {
          // the scroller rounded the move away: take a whole pixel, and stop if that fails too
          view.scrollLeft = cur + (gap > 0 ? 1 : -1) * Math.min(1, Math.abs(gap));
          wheelSet = view.scrollLeft;
          if (wheelSet === cur) wheelTarget = null;
        }
        if (wheelTarget !== null && Math.abs(wheelTarget - wheelSet) < least) wheelTarget = null;
        userUntil = t + 1800;
        lastScrollEv = t;
      }
    } else if (Math.abs(vel) > 8 && !drag) {
      // coasting after a mouse drag
      view.scrollLeft += vel * dt;
      vel *= Math.exp(-dt * 3.4);
      userUntil = t + 1800;
      lastScrollEv = t;
    } else {
      vel = 0;
      // drift only across finished painting
      if (drifting && !drag && t > userUntil && t > holdUntil) {
        var k = tileAtRightEdge();
        if (k < 0 || tiles.has(k)) {
          driftPx += DRIFT * s * dt;
          if (driftPx > 240) fold();
          else applyDrift();
        }
      }
    }
    sendView(false);
    if (painter) painter.tick(t < userUntil ? 4 : 7);
    if (flushDue(t)) flush(t);
    var edge = tileAtRightEdge();
    var waiting = painter && painter.busy && edge >= 0 && !tiles.has(edge);
    statusEl.classList.toggle("on", !!waiting);
    requestAnimationFrame(frame);
  }

  window.__shanshui = {
    mode: function() { return painter ? painter.mode : null; },
    seed: function() { return seed; },
    tiles: function() { return tiles.size; },
    pending: function() { return pending.length; },
    received: function() { return received; },
    repeats: function() { return repeats; },
    flushes: function() { return flushes; },
    stale: function() { return stale.length; },
  };

  layout();
  window.addEventListener("resize", layout);
  if (window.ResizeObserver) new ResizeObserver(function() {
    if (view.clientHeight !== H || view.clientWidth !== viewW || (window.devicePixelRatio || 1) !== dpr) layout();
  }).observe(view);
  document.documentElement.style.setProperty("--paper", PALETTES[paletteKey].paper);
  document.documentElement.style.setProperty("--front", mix(PALETTES[paletteKey].paper, "#ffffff", 0.3));
  startPainting(seed);
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
